[project]
name = "alpha-surface"
version = "0.1.0"
description = "Alpha Surface: options and volatility analytics on live tastytrade data. Implied vs realized vol, option chains, a screener, stored for backtests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "tastytrade>=12.4,<14",     # unofficial SDK, breaking changes between majors
    "yfinance>=0.2.50",         # daily and hourly bars, fund data, news, economic calendar
    "httpx>=0.27",              # tastytrade response hooks, Finnhub, ntfy alerts
    "duckdb>=0.10",
    "pyarrow>=15.0",            # Parquet read and write
    "streamlit>=1.58",          # st.iframe, keyed containers, page visibility
    "plotly>=5.20",             # vol surface and screener charts; price charts use TradingView Lightweight
    "python-dotenv>=1.0",
    "pandas-market-calendars>=5.0",  # NYSE and CME sessions, holidays and early closes (dip.clock)
]

[project.optional-dependencies]
studies = [
    "matplotlib>=3.8",          # figures for studies/
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is the formatter's job
    "RUF001",  # ambiguous unicode in strings: the UI uses typographic symbols on purpose
    "RUF002",  # same, docstrings
    "RUF003",  # same, comments
    "C408",    # dict(a=1) reads better for Plotly layout and style arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017"]   # assert False and broad pytest.raises are fine in tests

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
mypy_path = "src"
explicit_package_bases = true
exclude = ["^data/", "^build/"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls a real data provider (tastytrade, Yahoo); run with pytest -m live",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/present/streamlit_app.py",   # Streamlit entrypoint: navigation wiring only
]

[tool.coverage.report]
# Floor under the CI measurement (empty store: 47 to 49% on 2026-10-08). Raise it as page tests land.
fail_under = 55
show_missing = false
skip_covered = true
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
