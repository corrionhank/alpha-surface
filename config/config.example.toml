# Optional settings. Copy to config/config.toml (gitignored) to change a default.
# Secrets never go here: tastytrade, Finnhub and FRED credentials live in .env (see .env.example).

[storage]
# Data directory. Defaults to the repo's data/ folder; ALPHASURFACE_DATA_DIR overrides both.
# data_dir = "~/data/market"
# DuckDB database file, relative to data_dir.
db_file = "market.duckdb"

[notify]
# Screener alerts from the scheduled scan. Off unless enabled. When on, new hits raise a macOS
# notification; set ntfy_url (a private https://ntfy.sh/<topic>) to also push to a phone.
enabled = false
macos = true
ntfy_url = ""
# The same hit notifies again only after this many hours.
cooldown_hours = 24
