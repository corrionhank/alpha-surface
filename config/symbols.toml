# Tracked universe. Liquid, high open-interest options markets only: every symbol here is pulled
# daily (alphasurface.collector.yfinance_collector) and the single names also get tastytrade metrics.

[indices]
# Index ETFs: the core of every page.
equities = ["SPY", "QQQ", "IWM", "DIA"]
# Futures roots, tastytrade form. Live quotes use the front month; Yahoo's continuous contract
# (ES=F) backs the history.
futures = ["/ES", "/NQ", "/RTY"]

[single_names]
# Mega caps with deep option markets: metrics, the screener's default universe, and the
# dashboard's implied vs realized panel.
equities = ["AAPL", "NVDA", "MSFT", "AMZN", "META", "TSLA", "GOOGL"]

[vol_complex]
# VIX family, Yahoo spelling. VIX1D, VIX9D, VIX3M and VIX6M make the term curve; VXN is the
# Nasdaq-100 30-day implied; VVIX and SKEW price the vol and the tail.
vix = ["^VIX", "^VIX1D", "^VIX9D", "^VIX3M", "^VIX6M", "^VVIX", "^SKEW", "^VXN"]
# Cross-asset implied vol: MOVE (Treasuries), GVZ (gold), OVX (crude).
cross_asset = ["^MOVE", "^GVZ", "^OVX"]

[macro_etfs]
# Safe-haven and credit demand for the fear and greed composite, and the watchlist.
etfs = ["TLT", "IEF", "HYG", "GLD"]

[rates]
# 13-week T-bill yield: the risk-free fallback when tastytrade's rate is unavailable.
yields = ["^IRX", "^FVX", "^TNX", "^TYX"]
